services:
  - type: web
    name: substream-private-addon
    env: node
    plan: free
    buildCommand: npm install && npm run build:frontend
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
